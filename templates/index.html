<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stock Advisor</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- <script src="{{ url_for('static', filename='js/app.js') }}"></script> -->
    <script>
        document.addEventListener('DOMContentLoaded', function () {
    // Handle form submission
    document.getElementById('analyzerForm').addEventListener('submit', function(e) {
        e.preventDefault();

        // Get user input values
        const userReturn = parseFloat(document.getElementById('return').value);
        const userRisk = parseInt(document.getElementById('risk').value);

        // Send the data to the Flask backend for analysis
        fetch('/analyze', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
            },
            body: JSON.stringify({ return: userReturn, risk: userRisk })
        })
        .then(response => response.json())
        .then(data => {
            console.log("Data received from backend:", data);
            if (data.stocks && data.stocks.length > 0) {
                displayResults(data);
            } else {
                console.error("No stocks received or incorrect data format.");
            }
        })
        .catch(error => console.error('Error:', error));
    });

    // Function to display the results in a table and chart
    function displayResults(data) {
    const recommendationTableBody = document.querySelector('#recommendationTable tbody');
    recommendationTableBody.innerHTML = '';  // Clear any previous rows

    // Loop through the recommended stocks and append them to the table
    data.stocks.forEach(stock => {
        const row = document.createElement('tr');
        row.innerHTML = `
            <td>${stock.Ticker}</td>
            <td>${stock['1-Year Return']}</td>
            <td>${stock['Risk Score']}</td>
            <td>${stock['Suitability Score'].toFixed(2)}</td>
        `;
        recommendationTableBody.appendChild(row);
    });

    // Display the results section
    document.getElementById('results').style.display = 'block';

    // Prepare the chart data
    const ctx = document.getElementById('scoreChart').getContext('2d');
    const chartData = {
        labels: data.stocks.map(stock => stock.Ticker),
        datasets: [{
            label: 'Suitability Score',
            data: data.stocks.map(stock => stock['Suitability Score']),
            borderColor: '#003366',
            backgroundColor: '#003366',
            fill: false
        }]
    };

    // Create a new chart instance
    window.scoreChart = new Chart(ctx, {
        type: 'bar',
        data: chartData,
        options: {
            responsive: true,
            scales: {
                y: {
                    beginAtZero: true,
                    max: 10
                }
            }
        }
    });
}
});
    </script>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f9;
        }
        .container {
            width: 100%;
            max-width: 800px;
            margin: auto;
            padding: 20px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        button {
            padding: 10px 20px;
            background-color: #2563eb;
            color: white;
            border: none;
            cursor: pointer;
        }
        #results {
            display: none;
        }
        table {
            width: 100%;
            margin-top: 20px;
            border-collapse: collapse;
        }
        th, td {
            padding: 10px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }
        th {
            background-color: #2563eb;
            color: white;
        }
        td {
            background-color: #fff;
        }
        canvas {
            margin-top: 20px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Stock Advisor</h1>
    <p>Find the stocks that fit your style.</p>

    <form id="analyzerForm">
        <div class="form-group">
            <label for="return">Desired 1-Year Return:</label>
            <input type="number" id="return" step="0.01" placeholder="Enter desired 1-Year Return" required><br><br>

            <label for="risk">Desired Risk Score (1-10):</label>
            <input type="number" id="risk" min="1" max="10" placeholder="Enter desired Risk Score" required><br><br>

            <button type="submit">Analyze</button>
        </div>
    </form>

    <div id="results">
        <h3>Top 5 Recommended Stocks</h3>
        <table id="recommendationTable">
            <thead>
                <tr>
                    <th>Ticker</th>
                    <th>1-Year Return</th>
                    <th>Risk Score</th>
                    <th>Suitability Score</th>
                </tr>
            </thead>
            <tbody>
                <!-- Recommended stock rows will go here -->
            </tbody>
        </table>
        <canvas id="scoreChart"></canvas>
    </div>
</div>
</body>
</html>
